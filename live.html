<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>正文预览 · 启动</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 15px/1.6 "PingFang SC", "Noto Sans SC", sans-serif;
      background: #faf8f5; color: #2c2825;
    }
    .box { text-align: center; padding: 2rem; max-width: 26rem; }
    .muted { color: #7a7268; font-size: .88rem; }
    .ok { color: #3b6d11; font-size: .9rem; margin-top: .75rem; }
    .err { color: #b42318; margin-top: 1rem; font-size: .9rem; }
    code { font-size: .8rem; word-break: break-all; }
    a { color: #8b6914; }
  </style>
</head>
<body>
  <div class="box" id="boot">
    <p id="msg">正在向 GitHub 查询最新正文…</p>
    <p class="muted">本页是启动器：每次打开都按最新 commit 加载，不依赖 htmlpreview 旧缓存。</p>
    <p class="ok" id="ok" hidden></p>
    <p class="err" id="err" hidden></p>
  </div>
  <script>
    (function () {
      var REPO = "jackytyangovo/Cloud";
      var BRANCH = "preview";
      var RAW_PATH = "/novel-project/preview/standalone.html";

      function $(id) { return document.getElementById(id); }
      function setMsg(t) { var el = $("msg"); if (el) el.textContent = t; }
      function setOk(t) { var el = $("ok"); if (!el) return; el.hidden = !t; el.textContent = t || ""; }
      function setErr(html) { var el = $("err"); if (!el) return; el.hidden = !html; el.innerHTML = html || ""; }

      function fetchText(url) {
        return fetch(url, { cache: "no-store", credentials: "omit", mode: "cors" }).then(function (res) {
          if (!res.ok) throw new Error(res.status + " " + url);
          return res.text();
        });
      }

      function tipSha() {
        var path = RAW_PATH.replace(/^\//, "");
        var url =
          "https://api.github.com/repos/" +
          REPO +
          "/commits?path=" +
          encodeURIComponent(path) +
          "&sha=" +
          encodeURIComponent(BRANCH) +
          "&per_page=1";
        return fetchText(url).then(function (t) {
          var list = JSON.parse(t);
          if (list && list[0] && list[0].sha) return list[0].sha;
          throw new Error("empty commits");
        });
      }

      function loadHtml(sha) {
        var ts = Date.now();
        var urls = [];
        if (sha) {
          urls.push("https://cdn.jsdelivr.net/gh/" + REPO + "@" + sha + RAW_PATH + "?t=" + ts);
          urls.push("https://raw.githubusercontent.com/" + REPO + "/" + sha + RAW_PATH + "?t=" + ts);
        }
        urls.push("https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + RAW_PATH + "?t=" + ts);
        urls.push("https://cdn.jsdelivr.net/gh/" + REPO + "@" + BRANCH + RAW_PATH + "?t=" + (ts + 1));
        var i = 0;
        function next(err) {
          if (i >= urls.length) return Promise.reject(err || new Error("all failed"));
          var u = urls[i++];
          setMsg("拉取正文… " + u.replace(/^https:\/\//, "").slice(0, 48) + "…");
          return fetchText(u).catch(next);
        }
        return next();
      }

      function openHtml(html, sha) {
        var hasTang = html.indexOf("堂弟") >= 0 || html.indexOf("堂哥") >= 0;
        var rev = (html.match(/preview-revision" content="([^"]+)"/) || [])[1] || "?";
        setOk(
          "已取得 " +
            (sha ? sha.slice(0, 10) : BRANCH) +
            " · rev " +
            rev.slice(0, 8) +
            (hasTang ? " · 含「堂哥/堂弟」" : " · 警告：未含堂称谓") +
            " · 正在打开…"
        );
        /* 用 blob 打开，脱离 htmlpreview 的旧 document 壳 */
        var blob = new Blob([html], { type: "text/html;charset=utf-8" });
        var href = URL.createObjectURL(blob);
        setTimeout(function () {
          location.replace(href);
        }, 120);
      }

      tipSha()
        .then(function (sha) {
          setMsg("最新 commit：" + sha.slice(0, 12) + "，开始下载…");
          return loadHtml(sha).then(function (html) {
            return { html: html, sha: sha };
          });
        })
        .catch(function () {
          setMsg("API 不可用，改试分支直链…");
          return loadHtml(null).then(function (html) {
            return { html: html, sha: null };
          });
        })
        .then(function (pack) {
          if (!pack.html || pack.html.indexOf("<html") < 0) throw new Error("not html");
          openHtml(pack.html, pack.sha);
        })
        .catch(function (e) {
          setErr(
            "启动失败" +
              (e && e.message ? "（" + e.message + "）" : "") +
              "。<br/>请改用钉死链（含堂称谓的当前版）：<br/>" +
              '<a href="https://htmlpreview.github.io/?https://cdn.jsdelivr.net/gh/' +
              REPO +
              "@c6617efa758fe6e35d008ab18eaac9802dcf3ed0" +
              RAW_PATH +
              '">打开钉死预览</a>'
          );
        });
    })();
  </script>
</body>
</html>
